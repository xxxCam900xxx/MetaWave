openapi: 3.0.3
info:
  title: MetaWave Live Radio API
  version: 2.0.0
  description: API für MetaWave Live Radio. Public- und Protected-Endpunkte getrennt.

servers:
  - url: http://localhost:8000
    description: Lokaler Entwicklungsserver

tags:
  - name: Authentication
    description: Endpunkte für Login und Token-Validierung
  - name: Radio
    description: Live-Radio-Stream und Steuerung
  - name: Playlist Manager
    description: YouTube Playlists verwalten (hinzufügen, aktivieren/deaktivieren, löschen)
  - name: Notification - Signal
    description: Signal-spezifische Notification-Routen (invite/leave)
  - name: Notification - Email
    description: E-Mail-spezifische Notification-Routen (invite/leave)
  - name: Notification - Jobs
    description: Geplante oder manuell ausgelöste Notification-Jobs (run-job)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization header mit Bearer JWT-Token (aus /auth/login)

  schemas:
    StreamMeta:
      type: object
      properties:
        filename:
          type: string
          example: song3.mp3
        title:
          type: string
          example: Song XYZ
        author:
          type: string
          example: Künstler ABC
        duration:
          type: integer
          description: Länge des Songs in Sekunden
          example: 215
        cover:
          type: string
          format: uri
          example: https://example.com/cover.jpg
        index:
          type: integer
          example: 2
        total:
          type: integer
          example: 12
        elapsed:
          type: integer
          description: Sekunden seit Start des Songs
          example: 45

    QueueItem:
      type: object
      properties:
        song:
          type: string
          description: Dateiname der Audiodatei
          example: song4.mp3
        title:
          type: string
          example: Song ABC
        author:
          type: string
          example: Künstler XYZ
        duration:
          type: integer
          example: 180
        cover:
          type: string
          format: uri
          example: https://example.com/cover2.jpg
        index:
          type: integer
          example: 3
        isPlaying:
          type: boolean
          example: false

    QueueState:
      type: object
      properties:
        nowPlayingIndex:
          type: integer
          example: 2
        nowPlaying:
          type: string
          example: song3.mp3
        queue:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"

    InviteRequest:
      type: object
      properties:
        groupId:
          type: string
          example: "12345-abcde"

    InviteResponse:
      type: object
      properties:
        status:
          type: integer
          example: 201
        message:
          type: string
          example: SignalGroup was Successfully added
        result:
          type: object
          properties:
            success:
              type: boolean
              example: true
            groupId:
              type: string
              example: "12345-abcde"

    LeaveRequest:
      type: object
      properties:
        groupId:
          type: string

    LeaveResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: SignalGroup was Successfully deleted

    EmailInviteRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"

    EmailInviteResponse:
      type: object
      properties:
        status:
          type: integer
          example: 201
        message:
          type: string
          example: Email recipient was Successfully added
        result:
          type: object
          properties:
            success:
              type: boolean
              example: true
            email:
              type: string
              example: "user@example.com"

    EmailLeaveRequest:
      type: object
      properties:
        email:
          type: string
          format: email

    EmailLeaveResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Email recipient was Successfully deleted

    RunJobResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Signal Notification job executed

    Playlist:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Meine Lieblingsmusik
        url:
          type: string
          format: uri
          example: https://www.youtube.com/playlist?list=PLxxx
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VolumeResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        volume:
          type: integer
          description: Aktuelle Lautstärke in Prozent (0-200)
          example: 100

paths:
  # ======================
  # Authentication
  # ======================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login mit Wave-Token (POST)
      description: Erhält ein temporäres JWT-Token nach Validierung des `wavetoken` im Body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wavetoken:
                  type: string
                  example: MW202601-RADIO
      responses:
        "200":
          description: Erfolgreicher Login
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Sucessfully Logged In
                  token:
                    type: string
                    example: eyJhbGciOiJI...
        "401":
          description: Ungültiges `wavetoken`
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Invalid wavetoken
    get:
      tags:
        - Authentication
      summary: Login via URL-Parameter (GET)
      description: |
        Ermöglicht die Authentifizierung direkt über einen URL-Parameter (wavetoken).
        Dies erlaubt direkte Links zum Player ohne manuelle Eingabe des Tokens.
        
        **Beispiel:** `https://metawave.example.com/auth/login?wavetoken=MW202601-RADIO`
        
        **Client-Verwendung:** `https://metawave.example.com/?wavetoken=MW202601-RADIO`
      parameters:
        - in: query
          name: wavetoken
          required: true
          schema:
            type: string
            example: MW202601-RADIO
          description: Der aktuelle WaveToken für den aktuellen Monat
      responses:
        "200":
          description: Erfolgreicher Login via URL-Parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Sucessfully Logged In
                  token:
                    type: string
                    description: JWT-Token für die Authentifizierung
                    example: eyJhbGciOiJI...
        "401":
          description: Ungültiges `wavetoken`
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Invalid wavetoken
        "500":
          description: Server-Fehler (z.B. WaveToken nicht konfiguriert)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: WaveToken not configured in database

  /auth/validate:
    post:
      tags:
        - Authentication
      summary: Token validieren und erneuern
      description: "Prüft das übergebene `Authorization: Bearer <token>` Header und gibt ein erneuertes Token zurück."
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Token gültig und erneuert
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Token is Valid and Refreshed
                  token:
                    type: string
        "401":
          description: Ungültiges oder abgelaufenes Token

  # ======================
  # Radio
  # ======================
  /stream:
    get:
      tags:
        - Radio
      summary: Audio-Stream starten
      description: Liefert den Live-Audio-Stream (dauerhafte Verbindung).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Audio Stream (MPEG)
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized

  /stream/meta/currentsong:
    get:
      tags:
        - Radio
      summary: Metadaten des aktuell laufenden Songs
      description: Liefert Metadaten des Songs inklusive Titel, Autor, Cover, Dauer und elapsed time.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aktuelle Stream-Metadaten
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Displaying the metadata for the currently playing song
                  metadata:
                    $ref: "#/components/schemas/StreamMeta"
        "401":
          description: Unauthorized

  /stream/meta/queue:
    get:
      tags:
        - Radio
      summary: Kompletter Queue-Status
      description: Liefert die Queue-Items in Reihenfolge, inklusive aktuellem Song.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aktueller Queue-Zustand
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Displaying the metadata for all songs in Queue
                  metadata:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueueItem"
        "401":
          description: Unauthorized

  /stream/control/skip:
    get:
      tags:
        - Radio
      summary: Aktuellen Song überspringen
      description: Beendet den aktuell laufenden Song sofort.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Skip erfolgreich
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Song has been skipped
        "401":
          description: Unauthorized

  /stream/control/previous:
    get:
      tags:
        - Radio
      summary: Vorherigen Song abspielen
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Previous erfolgreich
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Previous song will be played

  /stream/control/shuffle:
    get:
      tags:
        - Radio
      summary: Shuffle der noch nicht gespielten Songs
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Shuffle erfolgreich
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Queue shuffled

  /stream/control/jumpto/{index}:
    get:
      tags:
        - Radio
      summary: Zu einem Song in der Queue springen
      description: Springt zu einem bestimmten Index (Path-Parameter).
      security:
        - BearerAuth: []
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: integer
            example: 5
      responses:
        "200":
          description: Jump erfolgreich
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Jumped to Song Index 5

  /stream/control/volume:
    get:
      tags:
        - Radio
      summary: Aktuelle globale Lautstärke abfragen
      description: Liefert die aktuell konfigurierte Lautstärke in Prozent für alle Hörer.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aktuelle Lautstärke
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeResponse"
        "401":
          description: Unauthorized

  /stream/control/sound/{percentage}:
    get:
      tags:
        - Radio
      summary: Globale Lautstärke setzen
      description: "Setzt die globale Lautstärke (Prozent). Gültiger Bereich: 0-200."
      security:
        - BearerAuth: []
      parameters:
        - name: percentage
          in: path
          required: true
          schema:
            type: integer
            example: 80
      responses:
        "200":
          description: Lautstärke gesetzt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeResponse"
        "400":
          description: Ungültiger Prozentwert
        "401":
          description: Unauthorized

  /stream/settings:
    get:
      tags:
        - Radio
      summary: Alle Radio-Einstellungen abfragen
      description: Liefert die aktuellen Einstellungen für EBU R128 Loudness Normalization und Minimum Artist Distance.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aktuelle Einstellungen
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  monotoneEnabled:
                    type: boolean
                    example: false
                  monotoneReduceLoud:
                    type: boolean
                    example: false
                  minArtistDistance:
                    type: integer
                    example: 5
                    description: Minimale Anzahl von Songs zwischen demselben Künstler
        "401":
          description: Unauthorized

  /stream/settings/monotone:
    post:
      tags:
        - Radio
      summary: EBU R128 Loudness Normalization ein-/ausschalten
      description: Aktiviert oder deaktiviert die automatische Lautstärke-Normalisierung basierend auf LUFS-Werten.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
              required:
                - enabled
      responses:
        "200":
          description: Einstellung erfolgreich geändert
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: EBU R128 Loudness Normalization enabled
                  monotoneEnabled:
                    type: boolean
                    example: true
        "400":
          description: Ungültige Anfrage
        "401":
          description: Unauthorized

  /stream/settings/monotone/reduce-loud:
    post:
      tags:
        - Radio
      summary: EBU R128 Reduce Loud Songs ein-/ausschalten
      description: Bestimmt, ob auch laute Songs reduziert werden sollen (nur aktiv wenn Monotone aktiviert ist).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: false
              required:
                - enabled
      responses:
        "200":
          description: Einstellung erfolgreich geändert
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: EBU R128 Reduce Loud Songs disabled
                  monotoneReduceLoud:
                    type: boolean
                    example: false
        "400":
          description: Ungültige Anfrage
        "401":
          description: Unauthorized

  /stream/settings/artist-distance:
    post:
      tags:
        - Radio
      summary: Minimale Artist Distance setzen
      description: |
        Legt fest, wie viele Songs mindestens zwischen Songs desselben Künstlers liegen sollen.
        - 0 = deaktiviert (Standard-Shuffle)
        - ≥ 1 = Smart Shuffle mit Künstler-Abstand
        
        Der Smart Shuffle Algorithmus verhindert, dass der gleiche Künstler zu häufig hintereinander spielt.
        Bei Shuffle-Operationen werden Songs so angeordnet, dass möglichst viel Abstand zwischen Songs desselben Künstlers liegt.
        
        Edge Cases:
        - Wenn zu wenige verschiedene Künstler vorhanden sind, wird der bestmögliche Abstand gewählt
        - Der Algorithmus fällt gracefully zurück, wenn die Regel mathematisch nicht erfüllbar ist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                distance:
                  type: integer
                  minimum: 0
                  example: 5
                  description: Anzahl der Songs, die mindestens zwischen demselben Künstler liegen sollen
              required:
                - distance
      responses:
        "200":
          description: Einstellung erfolgreich geändert
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Minimum artist distance set to 5 songs
                  minArtistDistance:
                    type: integer
                    example: 5
        "400":
          description: Ungültige Anfrage (distance muss eine nicht-negative Zahl sein)
        "401":
          description: Unauthorized

  # ======================
  # Notification
  # ======================
  /notification/signal/invite:
    post:
      tags:
        - Notification - Signal
      summary: Signal-Gruppe einladen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: SignalGroup hinzugefügt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          description: Ungültige Anfrage (groupId fehlt)
        "409":
          description: Gruppe existiert bereits

  /notification/signal/leave:
    post:
      tags:
        - Notification - Signal
      summary: Signal-Gruppe entfernen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequest"
      responses:
        "200":
          description: SignalGroup entfernt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveResponse"
        "400":
          description: Ungültige Anfrage (groupId fehlt)
        "404":
          description: Gruppe nicht gefunden

  /notification/email/invite:
    post:
      tags:
        - Notification - Email
      summary: E-Mail-Empfänger einladen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInviteRequest"
      responses:
        "201":
          description: E-Mail-Empfänger hinzugefügt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInviteResponse"
        "400":
          description: Ungültige Anfrage (email fehlt oder ist ungültig)
        "409":
          description: E-Mail-Empfänger existiert bereits

  /notification/email/leave:
    post:
      tags:
        - Notification - Email
      summary: E-Mail-Empfänger entfernen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLeaveRequest"
      responses:
        "200":
          description: E-Mail-Empfänger entfernt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLeaveResponse"
        "400":
          description: Ungültige Anfrage (email fehlt oder ist ungültig)
        "404":
          description: E-Mail-Empfänger nicht gefunden

  /notification/run-job:
    get:
      tags:
        - Notification - Jobs
      summary: Notification Job ausführen (für Tests)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Job ausgeführt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunJobResponse"
  /playlist:
    get:
      tags:
        - Playlist Manager
      summary: Alle Playlists abrufen
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Liste aller Playlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  playlists:
                    type: array
                    items:
                      $ref: "#/components/schemas/Playlist"
        "401":
          description: Nicht autorisiert
    post:
      tags:
        - Playlist Manager
      summary: Neue Playlist hinzuf�gen
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name:
                  type: string
                  example: Meine Lieblingsmusik
                url:
                  type: string
                  format: uri
                  example: https://www.youtube.com/playlist?list=PLxxx
      responses:
        "201":
          description: Playlist erfolgreich hinzugef�gt
        "400":
          description: Ung�ltige Eingabe (name/url fehlt oder URL ung�ltig)
        "409":
          description: Playlist URL existiert bereits
        "401":
          description: Nicht autorisiert

  /playlist/{id}:
    put:
      tags:
        - Playlist Manager
      summary: Playlist aktualisieren (Name, URL oder Aktiv-Status)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                is_active:
                  type: boolean
      responses:
        "200":
          description: Playlist aktualisiert
        "404":
          description: Playlist nicht gefunden
        "401":
          description: Nicht autorisiert
    delete:
      tags:
        - Playlist Manager
      summary: Playlist l�schen
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist gel�scht
        "404":
          description: Playlist nicht gefunden
        "401":
          description: Nicht autorisiert
