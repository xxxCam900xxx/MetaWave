version: "3.9"

services:
  downloader:
    container_name: downloader
    build:
      context: ../..
      dockerfile: docker/metawave_server/dockerfile.downloader
    volumes:
      - songs:/songs
    environment:
      PLAYLIST_URL: "https://www.youtube.com/playlist?list=PLYfrfvAfnsDnKbAvlaQzHTxwToq0m5jMj"
    restart: "no"

  radio:
    container_name: server
    build:
      context: ../..
      dockerfile: docker/metawave_server/dockerfile.radio
    env_file:
        - .env
    volumes:
      - songs:/songs
    ports:
      - "8000:8000"
    depends_on:
      downloader:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  songs:
